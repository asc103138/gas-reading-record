  <style>
    :root {

    label.txt { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-top: 10px; }

    /* 頂部導覽標籤列 */

<body>

  <div class="header-card">
    <h1>🔴 每日報報 ─ 寶可夢讀報探險記錄表</h1>

  <fieldset>
    <legend class="c1">🔴 訓練家基本資料</legend>

  <!-- 小組討論文章一鍵快速帶入卡片（平板同組專用・免手抄） -->

    <div class="group-sync-header">
      <div id="groupSyncHeading" class="group-sync-title">👥 小組討論文章同步</div>
      <button type="button" id="btnRefreshGroup" class="refresh-btn">🔄 重新整理</button>
    </div>
    <div id="groupSyncBody">
      <!-- 動態載入小組討論文章 -->
    </div>
  </div>

  <fieldset>
    <legend class="c2">⚡ ① 文章標題與版面</legend>
    <label class="txt" for="section">🏷️ 版面名稱（必填）</label>

    <label class="txt" for="title">這篇文章的標題是？（必填）</label>

  </fieldset>

  <fieldset>

    <textarea id="question" rows="2" maxlength="500" placeholder="你還想更了解的內容"></textarea>
    <label class="txt" for="wantToKnow">🔍 想進一步了解的方向</label>
    <textarea id="wantToKnow" rows="2" maxlength="500" placeholder="例如想查某個專有名詞、想找更多資料…"></textarea>
  </fieldset>

  <fieldset>
    <legend class="c7">⭐ 冒險評價</legend>
    <div id="stars">
      <label><input type="radio" name="rating" value="1"><span>★</span></label>
      <label><input type="radio" name="rating" value="2"><span>★</span></label>
      <label><input type="radio" name="rating" value="3"><span>★</span></label>
      <label><input type="radio" name="rating" value="4"><span>★</span></label>
      <label><input type="radio" name="rating" value="5"><span>★</span></label>
    </div>
  </fieldset>

  <button id="send">🚀 送出讀報探險紀錄</button>
  <p id="status"></p>
  <p class="note">填完送出後，你的紀錄會存進老師的試算表。</p>

  <script>
    // ⚠️ 前端 JS 只能寫在這裡（index.html 的 script 區塊），不要另存成 .gs 檔
    var $ = function (id) { return document.getElementById(id); };

    function show(text, isError) {
      var el = $('status');
      el.textContent = text;
      el.className = isError ? 'error' : '';
    }
    function lock(on) { $('send').disabled = on; }

    // 預設填入今日日期（若尚未填寫）
    (function initDate() {
      var dateInput = $('date');
      if (dateInput && !dateInput.value) {
        var now = new Date();
        var yyyy = now.getFullYear();
        var mm = String(now.getMonth() + 1).padStart(2, '0');
        var dd = String(now.getDate()).padStart(2, '0');
        dateInput.value = yyyy + '-' + mm + '-' + dd;
      }
    })();

    // ★ 星星評分
    var starLabels = document.querySelectorAll('#stars label');
    document.querySelectorAll('#stars input').forEach(function (radio) {
      radio.addEventListener('change', function () {
        var val = Number(radio.value);
        starLabels.forEach(function (label, i) {
          label.querySelector('span').className = (i < val) ? 'on' : '';
        });
      });
    });

    function getRating() {
      var checked = document.querySelector('#stars input:checked');
      return checked ? Number(checked.value) : 0;
    }

    function resetRating() {
      var checked = document.querySelector('#stars input:checked');
      if (checked) checked.checked = false;
      starLabels.forEach(function (label) {
        label.querySelector('span').className = '';
      });
    }

    // 工具函式
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 本地快取（平板專用記憶：班級、組別、座號，省去學生重複輸入）
    function saveStorage() {
      try {
        if (window.localStorage) {
          localStorage.setItem('poke_classCode', $('classCode').value.trim());
          localStorage.setItem('poke_group', $('group').value);
          localStorage.setItem('poke_seat', $('seat').value.trim());
        }
      } catch (e) {}
    }

    function restoreStorage() {
      try {
        if (!window.localStorage) return;
        var c = localStorage.getItem('poke_classCode');
        var g = localStorage.getItem('poke_group');
        var s = localStorage.getItem('poke_seat');
        if (c && !$('classCode').value) $('classCode').value = c;
        if (g && !$('group').value) $('group').value = g;
        if (s && !$('seat').value) $('seat').value = s;
      } catch (e) {}
    }

    // 將選中的文章帶入表單輸入框
    function applyArticleToForm(sec, tit) {
      var secInput = $('section');
      var titleInput = $('title');
      secInput.value = sec;
      titleInput.value = tit;

      secInput.classList.remove('auto-filled');
      titleInput.classList.remove('auto-filled');
      void secInput.offsetWidth; // 觸發重繪
      secInput.classList.add('auto-filled');
      titleInput.classList.add('auto-filled');

      show('✅ 已成功帶入文章：' + (sec ? '【' + sec + '】' : '') + tit + '！訓練家請開始填寫心得！', false);
    }

    // 查詢並顯示小組討論文章（生生用平板・同組免手抄）
    function fetchGroupArticles() {
      var group = $('group').value;
      var card = $('groupSyncCard');
      var heading = $('groupSyncHeading');
      var body = $('groupSyncBody');

      if (!group || group === '個人閱讀') {
        card.style.display = 'none';
        return;
      }

      card.style.display = 'block';
      heading.innerHTML = '👥 正在同步【' + escapeHtml(group) + '】討論文章…';
      body.innerHTML = '<p style="color:#64748b; font-size:13.5px; margin:6px 0;">🔍 正在連線試算表，查詢今日小隊討論紀錄…</p>';

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        body.innerHTML = '<p style="color:#e11d48; font-size:13px; margin:4px 0;">（本地預覽環境，無法查詢 Google 試算表）</p>';
        return;
      }

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok && res.found && res.articles && res.articles.length > 0) {
            heading.innerHTML = '✨ 偵測到【' + escapeHtml(group) + '】今日討論文章（<strong>點擊一鍵帶入</strong>）：';
            var html = '<div class="group-sync-btns">';
            res.articles.forEach(function (art, idx) {
              var numText = idx === 0 ? '第一篇' : '第二篇';
              var secDisp = art.section ? ('【' + escapeHtml(art.section) + '】') : '';
              var titleDisp = escapeHtml(art.title);
              html += '<button type="button" class="group-article-btn" data-sec="' + escapeAttr(art.section) + '" data-title="' + escapeAttr(art.title) + '">'
                    + '<span>📖 ' + numText + '：' + secDisp + ' ' + titleDisp + '</span>'
                    + '<span class="badge" style="font-size:12px; background:#dcfce7; padding:4px 8px; border-radius:6px; color:#15803d; white-space:nowrap; margin-left:8px;">點我帶入 ➔</span>'
                    + '</button>';
            });
            html += '</div>';
            body.innerHTML = html;

            var btns = body.querySelectorAll('.group-article-btn');
            btns.forEach(function (btn) {
              btn.addEventListener('click', function () {
                btns.forEach(function (b) { b.classList.remove('active-choice'); });
                btn.classList.add('active-choice');

                var sec = btn.getAttribute('data-sec') || '';
                var tit = btn.getAttribute('data-title') || '';
                applyArticleToForm(sec, tit);
              });
            });
          } else {
            heading.innerHTML = '⏳ 尚未查詢到【' + escapeHtml(group) + '】今日紀錄';
            body.innerHTML = '<p style="color:#92400e; font-size:13.5px; margin:4px 0 6px;">同組同學在「👥 小組討論選篇」送出後，點右上方「🔄 重新整理」即可一鍵同步文章，免手抄！</p>';
          }
        })
        .withFailureHandler(function (err) {
          heading.innerHTML = '⚠️ 查詢失敗';
          body.innerHTML = '<p style="color:#dc2626; font-size:13px; margin:4px 0;">' + escapeHtml(err.message) + '</p>';
        })
        .getTodayGroupArticles({
          date: $('date').value,
          classCode: $('classCode').value.trim(),
          group: group
        });
    }

    // 解析網址參數（若從小組討論頁面直接點擊按鈕跳轉過來）
    (function parseUrlParams() {
      try {
        var search = window.location.search;
        if (!search) return;
        var params = new URLSearchParams(search);
        var pClass = params.get('classCode');
        var pGroup = params.get('group');
        var pSection = params.get('section');
        var pTitle = params.get('title');

        if (pClass) $('classCode').value = pClass;
        if (pGroup) $('group').value = pGroup;
        if (pSection) $('section').value = pSection;
        if (pTitle) $('title').value = pTitle;

        if (pSection || pTitle) {
          $('section').classList.add('auto-filled');
          $('title').classList.add('auto-filled');
          show('🎉 已自動帶入小組文章：' + (pSection ? '【' + pSection + '】' : '') + pTitle + '，請開始個人讀報！', false);
        }
      } catch (e) {}
    })();

    // 恢復快取與事件監聽
    restoreStorage();
    if ($('group').value && !$('title').value) {
      fetchGroupArticles();
    }

    $('group').addEventListener('change', function () {
      saveStorage();
      fetchGroupArticles();
    });
    $('classCode').addEventListener('change', function () {
      saveStorage();
      if ($('group').value) fetchGroupArticles();
    });
    $('date').addEventListener('change', function () {
      if ($('group').value) fetchGroupArticles();
    });
    $('seat').addEventListener('change', saveStorage);
    $('btnRefreshGroup').addEventListener('click', fetchGroupArticles);

    function clearArticleForm() {
      // 保持 date, classCode, group, seat，只清空文章內容與評分
      $('section').value = '';
      $('title').value = '';
      $('keywords').value = '';
      $('content').value = '';
      $('summary').value = '';
      $('reflection').value = '';
      $('learned').value = '';
      $('question').value = '';
      $('wantToKnow').value = '';
      resetRating();
      var activeBtn = document.querySelector('.group-article-btn.active-choice');
      if (activeBtn) activeBtn.classList.remove('active-choice');
    }

    function send() {
      var section = $('section').value.trim();
      if (!section) { show('請填寫版面名稱', true); return; }

      var classCode = $('classCode').value.trim();
      if (!classCode) { show('請填寫班級代號', true); return; }

      var title = $('title').value.trim();
      if (!title) { show('文章標題不能空白', true); return; }

      saveStorage();
      lock(true);
      show('送出中…', false);

      google.script.run
        .withSuccessHandler(function (res) {
          lock(false);
          if (res && res.ok) {
            clearArticleForm();
            show('✅ 已成功送出！這是第 ' + res.count + ' 筆紀錄。', false);
          } else {
            show('送出失敗：' + ((res && res.error) || '未知原因'), true);
          }
        })
        .withFailureHandler(function (err) {
          lock(false);
          show('送出失敗：' + err.message, true);
        })
        .submitReading({
          date: $('date').value,
          section: section,
          classCode: $('classCode').value,
          group: $('group').value,
          seat: $('seat').value,
          title: title,
          keywords: $('keywords').value,
          content: $('content').value,
          summary: $('summary').value,
          reflection: $('reflection').value,
          learned: $('learned').value,
          question: $('question').value,
          wantToKnow: $('wantToKnow').value,
          rating: getRating()
        });
    }

    $('send').addEventListener('click', send);

    // 在 GAS 環境下，確保頂部按鈕皆指向完整 Web App 網址以正常跳轉
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(url) {
        if (url) {
          var home = $('nav-home');
          var group = $('nav-group');
          if (home) home.href = url;
          if (group) group.href = url + '?page=group';
        }
      }).getScriptUrl();
    }
  </script>
</body>
</html>
